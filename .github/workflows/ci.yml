name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck + bash -n
        run: |
          shellcheck -S style scripts/install.sh scripts/uninstall.sh tests/smoke.sh
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh

  macos-dryrun:
    name: macos (dry-run)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh dry-run smoke test
        run: bash tests/smoke.sh

  windows:
    name: windows (lint + dry-run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path .\scripts -Settings .\.github\linters\PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -in 'Error','Warning') {
            throw "PSScriptAnalyzer reported errors/warnings"
          }
      - name: install.ps1 dry-run smoke test
        shell: pwsh
        run: .\tests\smoke.ps1

  # Real install on a clean Windows VM, with the exact one-liner users paste
  # (irm | iex), run twice (fresh + re-run). The "hostile" leg has no winget
  # and claude.ai blocked, so both fallbacks (direct Antigravity download, npm
  # Claude) are exercised.
  real-install-windows:
    name: real install (windows, ${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pwsh, exe: pwsh, hostile: false }
          - { name: windows-powershell-5.1, exe: powershell, hostile: false }
          - { name: hostile, exe: pwsh, hostile: true }
    steps:
      - name: Block claude.ai
        if: matrix.hostile
        shell: pwsh
        run: Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`r`n0.0.0.0 claude.ai`r`n0.0.0.0 www.claude.ai"
      # shell: can't take an expression, so the matrix picks the PowerShell
      # that runs the test body.
      - name: irm | iex, twice
        shell: pwsh
        run: |
          & ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -Command {
          $ErrorActionPreference = 'Continue'
          if ('${{ matrix.hostile }}' -eq 'true') {
            $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'WindowsApps' }) -join ';'
            if (Get-Command winget -ErrorAction SilentlyContinue) { throw 'winget still visible' }
          }
          $url = 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/install.ps1'
          $failed = $false
          foreach ($run in 1, 2) {
            $out = & { irm $url | iex } *>&1 | Out-String
            Write-Host $out
            $rows = ($out -split "`r?`n" | Where-Object { $_ -match '^\s+\S\s+(Git|Node\.js|Antigravity|Claude in editor|Hebrew support|Claude command)\s' } | ForEach-Object { $_.Trim() }) -join ' | '
            $notes = ($out -split "`r?`n" | Where-Object { $_ -match 'failed|Trying npm' } | ForEach-Object { $_.Trim() }) -join ' | '
            Write-Host "::notice title=${{ matrix.name }} run $run::$rows $notes"
            if ($out -notmatch 'You are all set') { Write-Host "::error title=${{ matrix.name }} run $run::$rows $notes"; $failed = $true }
          }
          $ag = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object Name -like 'Antigravity*' | ForEach-Object { "$($_.Name): " + ((Get-ChildItem (Join-Path $_.FullName 'bin') -ErrorAction SilentlyContinue).Name -join ',') }
          Write-Host "::notice title=${{ matrix.name }} antigravity folders::$($ag -join ' ; ')"
          if ($failed) { exit 1 }
          }
          exit $LASTEXITCODE

  # Real install on clean macOS runners, the one-liner users paste, twice. The
  # "hostile" leg hides Homebrew and blocks claude.ai (DMG + npm fallbacks).
  real-install-macos:
    name: real install (macos, ${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: homebrew, hostile: false }
          - { name: hostile, hostile: true }
    steps:
      - name: curl | bash, twice
        run: |
          if [ "${{ matrix.hostile }}" = true ]; then
            printf '0.0.0.0 claude.ai\n0.0.0.0 www.claude.ai\n' | sudo tee -a /etc/hosts >/dev/null
            PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v homebrew | paste -sd: -)"; export PATH
            if command -v brew >/dev/null; then echo "brew still visible"; exit 1; fi
          fi
          url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/install.sh"
          failed=0
          for run in 1 2; do
            out="$(curl -fsSL "$url" | bash 2>&1)"
            printf '%s\n' "$out"
            rows="$(printf '%s\n' "$out" | grep -E '(Git|Node\.js|Antigravity|Claude in editor|Hebrew support|Claude command) ' | sed 's/\x1b\[[0-9;]*m//g' | tr -s ' ' | paste -sd'|' -)"
            echo "::notice title=${{ matrix.name }} run $run::$rows"
            if ! printf '%s' "$out" | grep -q 'You are all set'; then echo "::error title=${{ matrix.name }} run $run::$rows"; failed=1; fi
          done
          exit "$failed"

  # Real, end-to-end install in a clean container (no dry-run). Proves the
  # script actually installs git, Node.js, and the Claude Code CLI from scratch.
  # Antigravity and its extensions are a GUI app that needs a display and a
  # Google sign-in, so they cannot be installed in headless CI and are not
  # exercised here.
  real-install-linux:
    name: real install (ubuntu container)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Prerequisites (curl, ca-certificates, git)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates git >/dev/null
      - name: Fetch this commit
        run: |
          git init -q /src
          cd /src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git -c protocol.version=2 fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Run install.sh for real
        run: bash /src/scripts/install.sh
      - name: Assert tools are installed and on PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fail=0
          for t in git node npm claude; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "OK   $t -> $("$t" --version 2>/dev/null | head -1)"
            else
              echo "FAIL missing: $t"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "REAL INSTALL OK" || exit 1
